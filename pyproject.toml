[project]
name = "transformers-lab"
version = "0.1.0"
description = "Трансформеры: от токенизации до fine-tuning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
# Папка datasets/ в корне — это данные, а не код; библиотека datasets остаётся сторонней
known-third-party = ["datasets"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
# Папка данных datasets/ в корне иначе затеняет библиотеку datasets для mypy;
# наши пакеты (day1-day5) — обычные, с __init__.py, на них настройка не влияет
namespace_packages = false
